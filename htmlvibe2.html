<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Convertisseur Vidéo en Son (Choix Caméra)</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }
        h1 { color: #ffffff; margin-bottom: 10px; }
        #container { position: relative; width: 640px; height: 480px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
        video { display: none; }
        canvas { border-radius: 8px; background-color: #000; width: 100%; height: 100%; }

        /* Zone de contrôles */
        .controls {
            margin-top: 20px;
            display: flex;
            gap: 15px;
            align-items: center;
        }
        button, select {
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 25px;
            background-color: #00adb5;
            color: white;
            cursor: pointer;
            transition: background 0.3s;
            outline: none;
        }
        button:hover, select:hover { background-color: #007880; }
        select {
            background-color: #222831;
            border: 2px solid #00adb5;
            appearance: none; /* Élimine le style par défaut sur mobile */
            -webkit-appearance: none;
        }
        #status { margin-top: 15px; font-style: italic; color: #888; }
    </style>
</head>
<body>

    <h1>Synesthésie : Vidéo vers Son</h1>
    <div id="container">
        <video id="video" width="640" height="480" autoplay playsinline></video>
        <canvas id="canvas" width="640" height="480"></canvas>
    </div>

    <div class="controls">
        <select id="camera-select">
            <option value="">Détection des caméras...</option>
        </select>
        <button id="btn-start">Activer l'Audio et la Caméra</button>
    </div>

    <div id="status">En attente de l'activation...</div>

<script>
const video = document.getElementById('video');
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d', { willReadFrequently: true });
const btnStart = document.getElementById('btn-start');
const cameraSelect = document.getElementById('camera-select');
const statusDiv = document.getElementById('status');

const WIDTH = 640;
const HEIGHT = 480;
const NUM_FIELDS = 200;
const SENSORS_PER_FIELD = 10;
const MAX_SENSOR_DISTANCE = 15;
const PADDING = 20;

let audioCtx = null;
let fields = [];
let isRunning = false;
let currentStream = null;

// --- NOUVEAU : Lister et peupler les caméras disponibles ---
async function getCameras() {
    try {
        // Demande une première autorisation rapide pour débloquer les labels des caméras
        const tempStream = await navigator.mediaDevices.getUserMedia({ video: true });
        // Libère immédiatement la caméra temporaire
        tempStream.getTracks().forEach(track => track.stop());

        const devices = await navigator.mediaDevices.enumerateDevices();
        const videoDevices = devices.filter(device => device.kind === 'videoinput');

        cameraSelect.innerHTML = ''; // Nettoyer les options

        videoDevices.forEach((device, index) => {
            const option = document.createElement('option');
            option.value = device.deviceId;
            // Utilise le nom de la caméra (ex: "Caméra arrière"), sinon un nom générique
            option.text = device.label || `Caméra ${index + 1}`;
            cameraSelect.appendChild(option);
        });

        statusDiv.textContent = "Caméras détectées. Prêt à démarrer.";
    } catch (err) {
        console.error("Impossible de lister les caméras :", err);
        statusDiv.textContent = "Autorisez l'accès pour lister les caméras disponibles.";
    }
}

// Appeler la détection des caméras dès le chargement de la page
getCameras();

// --- 1. Génération de la structure des Champs Récepteurs ---
function initFields() {
    fields = [];
    const activeWidth = WIDTH - (PADDING * 2);
    const activeHeight = HEIGHT - (PADDING * 2);
    const centerX = PADDING + activeWidth / 2;
    const centerY = PADDING + activeHeight / 2;
    const maxRadius = Math.min(activeWidth, activeHeight) / 2 - MAX_SENSOR_DISTANCE;

    for (let i = 0; i < NUM_FIELDS; i++) {
        const t = Math.pow(Math.random(), 2);
        const radius = t * maxRadius;
        const angle = Math.random() * Math.PI * 2;

        const fx = centerX + Math.cos(angle) * radius;
        const fy = centerY + Math.sin(angle) * radius;

        let sensors = [];
        let sumX = 0;
        let sumY = 0;

        for (let j = 0; j < SENSORS_PER_FIELD; j++) {
            const sAngle = Math.random() * Math.PI * 2;
            const sDist = Math.random() * MAX_SENSOR_DISTANCE;

            const sx = Math.max(PADDING, Math.min(WIDTH - PADDING, Math.round(fx + Math.cos(sAngle) * sDist)));
            const sy = Math.max(PADDING, Math.min(HEIGHT - PADDING, Math.round(fy + Math.sin(sAngle) * sDist)));

            sensors.push({ x: sx, y: sy });
            sumX += sx;
            sumY += sy;
        }

        const barycenterX = sumX / SENSORS_PER_FIELD;
        const barycenterY = sumY / SENSORS_PER_FIELD;

        const freq = 2500 - (((barycenterY - PADDING) / activeHeight) * (2500 - 150));
        const pan = ((barycenterX - PADDING) / activeWidth) * 2 - 1;

        fields.push({
            barycenterX,
            barycenterY,
            sensors,
            freq,
            pan,
            osc: null,
            gainNode: null,
            pannerNode: null,
            movingAverage: 0
        });
    }
}

// --- 2. Initialisation du Web Audio ---
function initAudio() {
    if (audioCtx) return; // Évite de recréer le contexte audio si on change juste de caméra

    audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    // Création d'un compresseur de dynamique pour éviter les saturations tout en rehaussant le niveau global
    const compressor = audioCtx.createDynamicsCompressor();
    compressor.threshold.setValueAtTime(-24, audioCtx.currentTime);
    compressor.knee.setValueAtTime(30, audioCtx.currentTime);
    compressor.ratio.setValueAtTime(12, audioCtx.currentTime);
    compressor.attack.setValueAtTime(0.003, audioCtx.currentTime);
    compressor.release.setValueAtTime(0.25, audioCtx.currentTime);

    const masterGain = audioCtx.createGain();
    // Augmentation du gain global (au lieu de 0.1 / NUM_FIELDS)
    masterGain.gain.setValueAtTime(0.05, audioCtx.currentTime);

    masterGain.connect(compressor);
    compressor.connect(audioCtx.destination);

    fields.forEach(field => {
        const osc = audioCtx.createOscillator();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(field.freq, audioCtx.currentTime);

        const gainNode = audioCtx.createGain();
        gainNode.gain.setValueAtTime(0, audioCtx.currentTime);

        const pannerNode = audioCtx.createStereoPanner();
        pannerNode.pan.setValueAtTime(field.pan, audioCtx.currentTime);

        osc.connect(gainNode);
        gainNode.connect(pannerNode);
        pannerNode.connect(masterGain);

        osc.start();

        field.osc = osc;
        field.gainNode = gainNode;
        field.pannerNode = pannerNode;
    });
}

// --- 3. Boucle de traitement Vidéo et Audio ---
function processFrame() {
    if (!isRunning) return;

    ctx.drawImage(video, 0, 0, WIDTH, HEIGHT);

    const imageData = ctx.getImageData(0, 0, WIDTH, HEIGHT);
    const data = imageData.data;
    const now = audioCtx.currentTime;

    fields.forEach(field => {
        let totalIntensity = 0;

        field.sensors.forEach(sensor => {
            const index = (sensor.y * WIDTH + sensor.x) * 4;
            const r = data[index];
            const g = data[index + 1];
            const b = data[index + 2];

            const luminance = 0.299 * r + 0.587 * g + 0.114 * b;
            totalIntensity += luminance;
        });

        const currentIntensity = (totalIntensity / SENSORS_PER_FIELD) / 255;
        field.movingAverage = 0.95 * field.movingAverage + 0.05 * currentIntensity;
        const netChange = Math.abs(currentIntensity - field.movingAverage);

        let finalVolume = 0;
        // Seuil d'activation légèrement réduit (0.008 au lieu de 0.015) et amplificateur augmenté (x25 au lieu de x10)
        if (netChange > 0.008 && currentIntensity > 0.1) {
            finalVolume = Math.min(1, netChange * 25) * currentIntensity;
        } else {
            finalVolume = 0;
        }

        field.gainNode.gain.linearRampToValueAtTime(finalVolume, now + 0.05);

        ctx.fillStyle = `rgba(255, 0, 0, ${0.05 + finalVolume * 0.95})`;
        ctx.beginPath();
        ctx.arc(field.barycenterX, field.barycenterY, 3, 0, Math.PI * 2);
        ctx.fill();
    });

    requestAnimationFrame(processFrame);
}

// --- 4. Démarrage et changement de Caméra ---
async function startApp() {
    // Si un flux existe déjà, on le coupe proprement avant d'ouvrir la nouvelle caméra
    if (currentStream) {
        currentStream.getTracks().forEach(track => track.stop());
    }

    const selectedDeviceId = cameraSelect.value;

    // Contraintes pour forcer la caméra choisie
    const constraints = {
        video: selectedDeviceId ? { deviceId: { exact: selectedDeviceId } } : { facingMode: "environment" }
    };

    try {
        statusDiv.textContent = "Démarrage de la caméra choisie...";
        currentStream = await navigator.mediaDevices.getUserMedia(constraints);
        video.srcObject = currentStream;

        video.onloadedmetadata = () => {
            // Initialise l'architecture des champs s'ils n'existent pas encore
            if (fields.length === 0) initFields();

            initAudio();
            isRunning = true;
            statusDiv.textContent = "Application en cours d'exécution. Bougez !";
            btnStart.textContent = "Changer de Caméra"; // Le bouton permet maintenant de basculer si on change le select
            processFrame();
        };
    } catch (err) {
        console.error("Erreur d'accès à la caméra sélectée :", err);
        statusDiv.textContent = "Erreur : Impossible d'ouvrir cette caméra.";
    }
}

// Lier le bouton au démarrage / changement
btnStart.addEventListener('click', startApp);

// Si l'utilisateur change de caméra dans la liste déroulante et que l'appli tournait déjà, on relance automatiquement
cameraSelect.addEventListener('change', () => {
    if (isRunning) {
        startApp();
    }
});
</script>
</body>
</html>
