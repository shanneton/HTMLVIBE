<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Convertisseur Vidéo en Son (Champs Récepteurs - Stabilité Corrigée)</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }
        h1 { color: #ffffff; margin-bottom: 10px; }
        #container { position: relative; width: 640px; height: 480px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
        video { display: none; }
        canvas { border-radius: 8px; background-color: #000; width: 100%; height: 100%; }
        button {
            margin-top: 20px;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            background-color: #00adb5;
            color: white;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            transition: background 0.3s;
        }
        button:hover { background-color: #007880; }
        #status { margin-top: 10px; font-style: italic; color: #888; }
    </style>
</head>
<body>

    <h1>Synesthésie : Vidéo vers Son</h1>
    <div id="container">
        <video id="video" width="640" height="480" autoplay playsinline></video>
        <canvas id="canvas" width="640" height="480"></canvas>
    </div>
    <button id="btn-start">Activer l'Audio et la Caméra</button>
    <div id="status">En attente de l'activation...</div>

<script>
const video = document.getElementById('video');
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d', { willReadFrequently: true });
const btnStart = document.getElementById('btn-start');
const statusDiv = document.getElementById('status');

const WIDTH = 640;
const HEIGHT = 480;
const NUM_FIELDS = 200;
const SENSORS_PER_FIELD = 10;
const MAX_SENSOR_DISTANCE = 15;
const PADDING = 20; // Marge de sécurité absolue pour éviter les bords de l'image

let audioCtx = null;
let fields = [];
let isRunning = false;

// --- 1. Génération de la structure des Champs Récepteurs ---
function initFields() {
    fields = [];

    // On définit le centre de la zone utile (hors bordures)
    const activeWidth = WIDTH - (PADDING * 2);
    const activeHeight = HEIGHT - (PADDING * 2);
    const centerX = PADDING + activeWidth / 2;
    const centerY = PADDING + activeHeight / 2;

    // Le rayon maximal est calculé pour que même les capteurs déportés de MAX_SENSOR_DISTANCE
    // ne puissent jamais dépasser la zone de PADDING.
    const maxRadius = Math.min(activeWidth, activeHeight) / 2 - MAX_SENSOR_DISTANCE;

    for (let i = 0; i < NUM_FIELDS; i++) {
        const t = Math.pow(Math.random(), 2);
        const radius = t * maxRadius;
        const angle = Math.random() * Math.PI * 2;

        const fx = centerX + Math.cos(angle) * radius;
        const fy = centerY + Math.sin(angle) * radius;

        let sensors = [];
        let sumX = 0;
        let sumY = 0;

        for (let j = 0; j < SENSORS_PER_FIELD; j++) {
            const sAngle = Math.random() * Math.PI * 2;
            const sDist = Math.random() * MAX_SENSOR_DISTANCE;

            // Placement strict des capteurs individuels à l'intérieur des limites de sécurité
            const sx = Math.max(PADDING, Math.min(WIDTH - PADDING, Math.round(fx + Math.cos(sAngle) * sDist)));
            const sy = Math.max(PADDING, Math.min(HEIGHT - PADDING, Math.round(fy + Math.sin(sAngle) * sDist)));

            sensors.push({ x: sx, y: sy });
            sumX += sx;
            sumY += sy;
        }

        const barycenterX = sumX / SENSORS_PER_FIELD;
        const barycenterY = sumY / SENSORS_PER_FIELD;

        // Fréquence (Y) et Panoramique (X) basés sur le barycentre sécurisé
        const freq = 2500 - (((barycenterY - PADDING) / activeHeight) * (2500 - 150));
        const pan = ((barycenterX - PADDING) / activeWidth) * 2 - 1;

        fields.push({
            barycenterX,
            barycenterY,
            sensors,
            freq,
            pan,
            osc: null,
            gainNode: null,
            pannerNode: null,
            movingAverage: 0 // Stockage du fond lumineux moyen à long terme
        });
    }
}

// --- 2. Initialisation du Web Audio ---
function initAudio() {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    const masterGain = audioCtx.createGain();
    // Volume global adapté au nombre important d'oscillateurs simultanés
    masterGain.gain.setValueAtTime(0.1 / NUM_FIELDS, audioCtx.currentTime);
    masterGain.connect(audioCtx.destination);

    fields.forEach(field => {
        const osc = audioCtx.createOscillator();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(field.freq, audioCtx.currentTime);

        const gainNode = audioCtx.createGain();
        gainNode.gain.setValueAtTime(0, audioCtx.currentTime);

        const pannerNode = audioCtx.createStereoPanner();
        pannerNode.pan.setValueAtTime(field.pan, audioCtx.currentTime);

        osc.connect(gainNode);
        gainNode.connect(pannerNode);
        pannerNode.connect(masterGain);

        osc.start();

        field.osc = osc;
        field.gainNode = gainNode;
        field.pannerNode = pannerNode;
    });
}

// --- 3. Boucle de traitement Vidéo et Audio ---
function processFrame() {
    if (!isRunning) return;

    ctx.drawImage(video, 0, 0, WIDTH, HEIGHT);

    const imageData = ctx.getImageData(0, 0, WIDTH, HEIGHT);
    const data = imageData.data;
    const now = audioCtx.currentTime;

    fields.forEach(field => {
        let totalIntensity = 0;

        field.sensors.forEach(sensor => {
            const index = (sensor.y * WIDTH + sensor.x) * 4;
            const r = data[index];
            const g = data[index + 1];
            const b = data[index + 2];

            const luminance = 0.299 * r + 0.587 * g + 0.114 * b;
            totalIntensity += luminance;
        });

        const currentIntensity = (totalIntensity / SENSORS_PER_FIELD) / 255;

        // FILTRE DE MOUVEMENT AMÉLIORÉ :
        // On met à jour une moyenne glissante très réactive (alpha = 0.05).
        // Cela permet de lisser et d'absorber le "bruit" numérique de la caméra.
        field.movingAverage = 0.95 * field.movingAverage + 0.05 * currentIntensity;

        // On calcule l'écart par rapport à cette moyenne stabilisée
        const netChange = Math.abs(currentIntensity - field.movingAverage);

        let finalVolume = 0;

        // Si l'écart de luminosité franchit le seuil du bruit de capteur (0.015),
        // alors il y a un vrai mouvement ou une variation lumineuse.
        if (netChange > 0.015 && currentIntensity > 0.1) {
            // Le volume devient proportionnel à la dynamique du changement
            finalVolume = Math.min(1, netChange * 10) * currentIntensity;
        } else {
            // Si c'est une image fixe ou un bord inactif, le son s'éteint complètement.
            finalVolume = 0;
        }

        // Application avec une rampe douce pour éliminer les clics
        field.gainNode.gain.linearRampToValueAtTime(finalVolume, now + 0.05);

        // Feedback visuel (le cercle rouge devient brillant uniquement s'il y a du son/mouvement)
        ctx.fillStyle = `rgba(255, 0, 0, ${0.05 + finalVolume * 0.95})`;
        ctx.beginPath();
        ctx.arc(field.barycenterX, field.barycenterY, 3, 0, Math.PI * 2);
        ctx.fill();
    });

    requestAnimationFrame(processFrame);
}

// --- 4. Démarrage de l'application ---
async function startApp() {
    if (isRunning) return;

    try {
        statusDiv.textContent = "Demande d'accès caméra...";
        const stream = await navigator.mediaDevices.getUserMedia({ video: { width: WIDTH, height: HEIGHT } });
        video.srcObject = stream;

        video.onloadedmetadata = () => {
            initFields();
            initAudio();
            isRunning = true;
            statusDiv.textContent = "Application en cours d'exécution. Bougez devant la caméra !";
            btnStart.style.display = 'none';
            processFrame();
        };
    } catch (err) {
        console.error("Erreur d'accès à la caméra ou à l'audio :", err);
        statusDiv.textContent = "Erreur : Impossible d'accéder à la caméra.";
    }
}

btnStart.addEventListener('click', startApp);
</script>
</body>
</html>
